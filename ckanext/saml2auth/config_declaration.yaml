# schema version of the config declaration. At the moment, the only valid value is `1`
version: 1

# an array of configuration blocks. Each block has an "annotation", that
# describes the block, and the list of options. These groups help to separate
# config options visually, but they have no extra meaning.
groups:

# short text that describes the group. It can be shown in the config file
# as following:
#   ## MyExt settings ##################
#   some.option = some.value
#   another.option = another.value
  - annotation: saml2auth general settings
    options:
      - key: ckanext.saml2auth.enable_ckan_internal_login
      - key: ckanext.saml2auth.idp_metadata.local_path
      - key: ckanext.saml2auth.user_firstname
      - key: ckanext.saml2auth.user_lastname
      - key: ckanext.saml2auth.user_fullname
      - key: ckanext.saml2auth.user_email
      - key: ckanext.saml2auth.acs_endpoint
        default: '/acs'
      - key: ckanext.saml2auth.sp.name_id_policy_format
      - key: ckanext.saml2auth.idp_metadata.location
      - key: ckanext.saml2auth.idp_metadata.remote_url
      - key: ckanext.saml2auth.idp_metadata.remote_cert

